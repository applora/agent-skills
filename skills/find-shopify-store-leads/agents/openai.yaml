interface:
  display_name: "Shopify Store Lead Research"
  short_description: "Assess merchant fit from public review evidence"
  default_prompt: "Use $find-shopify-store-leads to identify a small merchant shortlist from public reviews, with evidence, limitations, and respectful outreach angles."

dependencies:
