interface:
  display_name: "Shopify Research Workflow"
  short_description: "Take a question through evidence to a private report"
  default_prompt: "Use $run-shopify-app-research to investigate my Shopify App Store question and, if requested, save a private report in my chosen language."

dependencies:
  tools:
    - type: "mcp"
      value: "applora"
      description: "Shopify App Store research data and private report workspace"
      transport: "streamable_http"
      url: "https://api.applora.ai/mcp"
