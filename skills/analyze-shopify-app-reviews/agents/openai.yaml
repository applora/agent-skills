interface:
  display_name: "Shopify Review Analysis"
  short_description: "Find merchant needs in a transparent review sample"
  default_prompt: "Use $analyze-shopify-app-reviews to identify recurring merchant needs and product priorities from a bounded review sample."

dependencies:
  tools:
    - type: "mcp"
      value: "applora"
      description: "Shopify App Store research data and private report workspace"
      transport: "streamable_http"
      url: "https://api.applora.ai/mcp"
