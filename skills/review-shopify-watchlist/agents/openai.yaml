interface:
  display_name: "Shopify Watchlist Review"
  short_description: "Turn saved research targets into a dated follow-up"
  default_prompt: "Use $review-shopify-watchlist to review my selected watchlist targets, compare relevant earlier findings, and summarize what needs attention."

dependencies:
  tools:
    - type: "mcp"
      value: "applora"
      description: "Shopify App Store research data and private report workspace"
      transport: "streamable_http"
      url: "https://api.applora.ai/mcp"
