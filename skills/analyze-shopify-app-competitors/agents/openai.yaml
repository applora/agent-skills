interface:
  display_name: "Shopify Competitor Research"
  short_description: "Compare positioning, pricing, visibility and feedback"
  default_prompt: "Use $analyze-shopify-app-competitors to compare these Shopify apps and recommend a defensible positioning or product opportunity."

dependencies:
